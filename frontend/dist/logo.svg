<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#785109" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge (Transparent Background) -->
  <g transform="translate(10, 10)">
    <!-- Outer & Inner Gold Plate Rim -->
    <circle cx="40" cy="40" r="34" stroke="url(#goldGradLogo)" stroke-width="3" fill="none"/>
    <circle cx="40" cy="40" r="26" stroke="url(#goldGradLogo)" stroke-width="1.5" opacity="0.6" fill="none"/>

    <!-- Fork (Left) -->
    <path d="M 33 25 V 36 M 29 25 V 35 C 29 39, 37 39, 37 35 V 25 M 33 39 V 55" stroke="url(#goldGradLogo)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Spoon (Right) -->
    <path d="M 47 25 C 42 25, 42 37, 47 37 C 52 37, 52 25, 47 25 Z M 47 37 V 55" stroke="url(#goldGradLogo)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="url(#goldGradLogo)"/>
  </g>

  <!-- Typography (Slightly darker text for high contrast on light & dark headers) -->
  <text x="108" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" letter-spacing="0.5">
    <tspan fill="#0F172A">Dine</tspan><tspan fill="url(#goldGradLogo)">Flow</tspan>
  </text>
  <text x="110" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#475569" letter-spacing="3.5">
    PREMIUM DINING &amp; RESERVATIONS
  </text>
</svg>
