<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7412" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Outer Plate Rim -->
  <circle cx="50" cy="50" r="34" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
  <!-- Inner Plate Ring -->
  <circle cx="50" cy="50" r="26" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" fill="none"/>

  <!-- Fork (Left) -->
  <path d="M 43 35 V 45 M 40 35 V 44 C 40 47, 46 47, 46 44 V 35 M 43 47 V 65" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Spoon (Right) -->
  <path d="M 57 35 C 52 35, 52 47, 57 47 C 62 47, 62 35, 57 35 Z M 57 47 V 65" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="url(#goldGrad)"/>
</svg>
